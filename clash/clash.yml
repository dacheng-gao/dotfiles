# ==================== 策略组 ====================
proxy-groups:
  - name: "GLOBAL"
    type: select
    proxies:
      - "JMS@c22s4"
      - "JMS@c22s3"
      - "JMS@c22s5"
      - "JMS@c22s801"
      - "JMS@c6s4"
      - "JMS@c6s3"
      - "JMS@c6s5"
      - "JMS@c6s801"

# ==================== 规则（重点防循环） ====================
rules:
  # 1. JMS 节点与代理内核自身出站必须直连（防止被 TUN 再次代理）
  - DOMAIN-SUFFIX,portablesubmarines.com,DIRECT,no-resolve
  - IP-CIDR,67.230.171.47/32,DIRECT,no-resolve
  - IP-CIDR,23.106.128.132/32,DIRECT,no-resolve
  - IP-CIDR,104.245.103.12/32,DIRECT,no-resolve
  - PROCESS-NAME,v2ray,DIRECT
  - PROCESS-NAME,xray,DIRECT

  # 2. 本地回环 + 局域网 必须直连（防自循环）
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve

  # 3. Clash TUN 虚拟 IP 段直连（非常重要！）
  - IP-CIDR,198.18.0.0/15,DIRECT,no-resolve

  # 4. 中国大陆网络直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT

  # Halcrow 公司网络直连
  - IP-CIDR,43.128.21.87/32,DIRECT,no-resolve # 公司专线网络
  - DOMAIN,weareworldteam.1password.com,DIRECT # 1password
  - DOMAIN,ai.arcadedevhouse.com,DIRECT,no-resolve # sub2api
  - DOMAIN,shiftly.halcrow.com.au,DIRECT,no-resolve # shiftly 上班打卡
  - IP-CIDR,34.151.93.112/32,DIRECT,no-resolve # rwa staging web+data server
  - IP-CIDR,35.213.251.225/32,DIRECT,no-resolve # rwa production web server
  - IP-CIDR,35.244.114.46/32,DIRECT,no-resolve # rwa production data server
  - DOMAIN,rwasuite.com,DIRECT,no-resolve # rwa production website
  - IP-CIDR,13.239.162.82/32,DIRECT,no-resolve # Mainland UAT SQL Server
  # Halcrow SONNEL 项目要求直连：Microsoft SSO 登录有 IP 限制
  - DOMAIN-REGEX,microsoft,DIRECT # 域名通过正则匹配 microsoft
  - DOMAIN-REGEX,sharepoint,DIRECT # 域名通过正则匹配 sharepoint
  - DOMAIN-REGEX,nmhg-datalakehouse-db-server,DIRECT # 域名通过正则匹配 nmhg-datalakehouse-db-server
  - DOMAIN-REGEX,dailytakings,DIRECT # 域名通过正则匹配 dailytakings (DTS) 系统
  - DOMAIN,sonnel.arcadedevhouse.com,DIRECT # 域名精确匹配 sonnel.arcadedevhouse.com UAT 环境

  # 5. 所有其他流量走 GLOBAL
  - MATCH,GLOBAL
