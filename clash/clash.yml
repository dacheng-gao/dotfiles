# ==================== 全局设置 ====================
mode: global
log-level: info
find-process-mode: strict
geo-auto-update: true
geo-update-interval: 24
ipv6: false
allow-lan: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

# DNS
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:53
  ipv6: false
  "enhanced-mode": fake-ip          # or redir-host
  "fake-ip-range": 198.18.0.1/16
  "fake-ip-filter":
    - "*.lan"
    - "*.local"
    - "+.miwifi.com"
  "use-hosts": true
  "use-system-hosts": true
  "default-nameserver":             # 仅用于引导 DoH/DoT 域名解析，纯 IP 即可
    - 119.29.29.29
    - 223.5.5.5
  nameserver:                        # 代理流量使用海外 DoH
    - "https://1.1.1.1/dns-query#GLOBAL"
    - "https://dns.google/dns-query#GLOBAL"
  "direct-nameserver":              # 直连流量使用国内 DoH
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  "respect-rules": true
  "proxy-server-nameserver":
    - 119.29.29.29
    - 223.5.5.5

# ==================== 代理节点 ====================
proxies:
  - name: "v2ray"
    type: socks5
    server: 127.0.0.1
    port: 8224
    udp: true

# ==================== 策略组 ====================
proxy-groups:
  - name: "GLOBAL"
    type: select
    proxies: ["v2ray"]

# ==================== 规则（重点防循环） ====================
rules:
  # 1. v2ray 自身出站必须直连（防止被 TUN 再次代理）
  - PROCESS-NAME,v2ray,DIRECT

  # 2. 本地回环 + 局域网 必须直连（防自循环）
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve

  # 3. Clash TUN 虚拟 IP 段直连（非常重要！）
  - IP-CIDR,198.18.0.0/15,DIRECT,no-resolve

  # 4. v2ray 服务器域名保留为直连兜底
  - DOMAIN-SUFFIX,portablesubmarines.com,DIRECT,no-resolve
  # 如果你知道服务器的真实 IP，也可以加：
  # - IP-CIDR,你的服务器真实IP/32,DIRECT,no-resolve

  # 中国大陆网络直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT

  # Halcrow 公司专线直连
  - IP-CIDR,43.128.21.87/32,DIRECT,no-resolve # 公司海南专线
  - DOMAIN,weareworldteam.1password.com,DIRECT # 1password
  - DOMAIN,ai.arcadedevhouse.com,DIRECT,no-resolve # sub2api 服务
  - IP-CIDR,34.151.93.112/32,DIRECT,no-resolve # rwa 项目 staging 环境访问地址
  - IP-CIDR,35.213.251.225/32,DIRECT,no-resolve # rwa production web server
  - IP-CIDR,35.244.114.46/32,DIRECT,no-resolve # rwa production data server
  - DOMAIN,rwasuite.com,DIRECT,no-resolve # rwa production 环境访问地址

  # 5. 所有其他流量走 GLOBAL
  - MATCH,GLOBAL
