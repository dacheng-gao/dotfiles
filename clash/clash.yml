# ==================== 全局设置 ====================
mode: rule
log-level: info
find-process-mode: strict
geo-auto-update: true
geo-update-interval: 24
ipv6: false
allow-lan: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

# DNS
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:53
  ipv6: false
  "enhanced-mode": fake-ip          # or redir-host
  "fake-ip-range": 198.18.0.1/16
  "fake-ip-filter":
    - "*.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.portablesubmarines.com"
  "use-hosts": true
  "use-system-hosts": true
  "default-nameserver":             # 仅用于引导 DoH/DoT 域名解析，纯 IP 即可
    - 119.29.29.29
    - 223.5.5.5
  nameserver:                        # 代理流量使用海外 DoH
    - "https://1.1.1.1/dns-query#GLOBAL"
    - "https://dns.google/dns-query#GLOBAL"
  "direct-nameserver":              # 直连流量使用国内 DoH
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  "respect-rules": true
  "proxy-server-nameserver":
    - 119.29.29.29
    - 223.5.5.5

