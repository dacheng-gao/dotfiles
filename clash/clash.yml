# ==================== 规则（重点防循环） ====================
rules:
  # 1. JMS 节点与代理内核自身出站必须直连（防止被 TUN 再次代理）
  - DOMAIN-SUFFIX,portablesubmarines.com,DIRECT,no-resolve
  - IP-CIDR,67.230.171.47/32,DIRECT,no-resolve
  - IP-CIDR,23.106.128.132/32,DIRECT,no-resolve
  - IP-CIDR,104.245.103.12/32,DIRECT,no-resolve
  - PROCESS-NAME,v2ray,DIRECT
  - PROCESS-NAME,xray,DIRECT

  # 2. 本地回环 + 局域网 必须直连（防自循环）
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve

  # 3. Clash TUN 虚拟 IP 段直连（非常重要！）
  - IP-CIDR,198.18.0.0/15,DIRECT,no-resolve

  # 4. 中国大陆网络直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT

  # Halcrow 公司专线直连
