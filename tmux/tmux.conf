# This is a simplified version of tmux config.
# See https://github.com/gpakosz/.tmux

# default tmux prefix is C-b, update to use C-j
set-option -g prefix C-j
bind-key C-j send-prefix

# reload tmux.conf
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "reload tmux.conf done"

set-option -g default-terminal "tmux-256color"
set-option -g extended-keys on

set-option -s escape-time 10
set-option -sg repeat-time 600
set-option -s focus-events on

set-option -g history-limit 99999

set-option -g mouse on

# scroll one line per mouse wheel event in copy/view mode
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# set terminal window title
set-option -g set-titles on
set-option -g set-titles-string "#S"

# set status position to top
set-option -g status-position top

# custom status bar style
set-option -g status-style "fg=#6f6e69,bg=#e6e4d9"
set-option -g status-left-length 24
set-option -g status-left ""
set-option -g status-right-length 24
set-option -g status-right ""
set-option -g status-left-style ""
set-option -g status-right-style ""
set-option -g status-justify left
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-style "fg=#575653,bg=#e6e4d9"
set-window-option -g window-status-current-format " #I:#W "
set-window-option -g window-status-current-style "fg=#fffcf0,bg=#205ea6,bold"
set-window-option -g window-status-separator ""
set-window-option -g window-status-last-style "fg=#575653,bg=#e6e4d9"
set-window-option -g window-status-activity-style "fg=#664d01,bg=#e6e4d9,bold"
set-option -g message-style "fg=#100f0f,bg=#cecdc3,fill=#cecdc3"
set-option -g mode-style "fg=#fffcf0,bg=#205ea6"
set-window-option -g copy-mode-selection-style "fg=#fffcf0,bg=#205ea6"
set-option -g pane-border-style "fg=#9f9d96"
set-option -g pane-active-border-style "fg=#205ea6"

# start window and pane numbering at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# auto rename and renumber window
set-window-option -g automatic-rename on
set-option -g renumber-windows on

set-option -g display-panes-time 800 # slightly longer pane indicators display time
set-option -g display-time 1000      # slightly longer status messages display time

set-option -g status-interval 10 # redraw status bar every 10 seconds

# refresh screen; use prefix + C-k to clear tmux history explicitly
bind-key -n C-l send-keys C-l
bind-key C-k clear-history \; display-message "tmux history cleared"

# activity
set-option -g monitor-activity on
set-option -g visual-activity off

# create session
bind-key C-c new-session

# session and window picker
bind-key C-f choose-tree -Zw

# session navigation
bind-key BTab switch-client -l  # move to last session

# create a new window in the current pane's directory
bind-key c new-window -c "#{pane_current_path}"

# split current window horizontally
bind-key - split-window -v -c "#{pane_current_path}"
# split current window vertically
bind-key _ split-window -h -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# window navigation
unbind-key n
unbind-key p
bind-key -r C-h previous-window                             # select previous window
bind-key -r C-l next-window                                 # select next window
bind-key -r C-S-H swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind-key -r C-S-L swap-window -t +1 \; select-window -t +1  # swap current window with the next one
bind-key Tab last-window                                    # move to last active window

# pane navigation
bind-key -r h select-pane -L  # move left
bind-key -r j select-pane -D  # move down
bind-key -r k select-pane -U  # move up
bind-key -r l select-pane -R  # move right
bind-key > swap-pane -D       # swap current pane with the next one
bind-key < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2
